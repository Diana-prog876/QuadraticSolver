<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решение квадратных уравнений</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
        }

        header {
            background: #2c5282;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 { font-size: 22px; margin-bottom: 6px; }
        header p { color: #bee3f8; font-size: 15px; }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #2c5282;
            font-size: 16px;
            margin-bottom: 16px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 8px;
        }

        .inputs { display: flex; gap: 16px; flex-wrap: wrap; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 120px;
        }

        .input-group label {
            font-size: 13px;
            color: #555;
            font-weight: bold;
        }

        .input-group input {
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .input-group input:focus { border-color: #2c5282; }

        .methods { display: flex; gap: 20px; margin-top: 6px; }

        .methods label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }

        .methods input[type="radio"] { width: 16px; height: 16px; cursor: pointer; }

        .buttons { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.85; }

        #btnSolve { background: #2c5282; color: white; }
        #btnSteps { background: #276749; color: white; display: none; }
        #btnGraph { background: #744210; color: white; display: none; }
        #btnClear { background: #718096; color: white; }

        .result-box {
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .result-box.success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
        .result-box.error-box { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }

        #stepsBox {
            display: none;
            background: #f7fafc;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            color: #2d3748;
            border: 1px solid #e2e8f0;
            max-height: 300px;
            overflow-y: auto;
        }

        #graphBox { display: none; text-align: center; }

        canvas {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 13px;
        }

        .legend span { display: flex; align-items: center; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.blue { background: #2c5282; }
        .dot.red { background: #e53e3e; }
        .dot.green { background: #276749; }
    </style>
</head>
<body>

<header>
    <h1>Автоматизированная система вычисления корней квадратного уравнения</h1>
    <p>ax² + bx + c = 0 — Авасбекова Диана</p>
</header>

<div class="container">

    <!-- Ввод -->
    <div class="card">
        <h2>Введите коэффициенты</h2>
        <div class="inputs">
            <div class="input-group">
                <label>a (при x²)</label>
                <input type="number" id="inputA" placeholder="например: 1">
            </div>
            <div class="input-group">
                <label>b (при x)</label>
                <input type="number" id="inputB" placeholder="например: -5">
            </div>
            <div class="input-group">
                <label>c (свободный)</label>
                <input type="number" id="inputC" placeholder="например: 6">
            </div>
        </div>
    </div>

    <!-- Метод -->
    <div class="card">
        <h2>Выберите метод решения</h2>
        <div class="methods">
            <label>
                <input type="radio" name="method" value="discriminant" checked>
                Метод дискриминанта
            </label>
            <label>
                <input type="radio" name="method" value="vieta">
                Теорема Виета
            </label>
        </div>
    </div>

    <!-- Кнопки -->
    <div class="buttons">
        <button id="btnSolve" onclick="solve()">Решить</button>
        <button id="btnSteps" onclick="toggleSteps()">Пошаговое решение</button>
        <button id="btnGraph" onclick="toggleGraph()">График параболы</button>
        <button id="btnClear" onclick="clearAll()">Очистить</button>
    </div>

    <!-- Результат -->
    <div class="card" style="margin-top:20px;">
        <h2>Результат</h2>
        <div id="resultBox" class="result-box"></div>
    </div>

    <!-- Пошаговое решение -->
    <div class="card" id="stepsCard" style="display:none;">
        <h2>Пошаговое решение</h2>
        <div id="stepsBox"></div>
    </div>

    <!-- График -->
    <div class="card" id="graphCard" style="display:none;">
        <h2>График параболы</h2>
        <div id="graphBox">
            <canvas id="myCanvas" width="700" height="400"></canvas>
            <div class="legend">
                <span><span class="dot blue"></span> Парабола</span>
                <span><span class="dot red"></span> Корни</span>
                <span><span class="dot green"></span> Вершина</span>
            </div>
        </div>
    </div>

</div>

<script>
let lastData = null;

async function solve() {
    const a = document.getElementById('inputA').value;
    const b = document.getElementById('inputB').value;
    const c = document.getElementById('inputC').value;
    const method = document.querySelector('input[name="method"]:checked').value;

    if (!a || !b || !c) {
        showResult('Заполните все поля!', false);
        return;
    }

    const response = await fetch('/solve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ a, b, c, method })
    });

    const data = await response.json();

    if (data.error) {
        showResult(data.error, false);
        return;
    }

    lastData = data;
    showResult(data.result, data.x1 !== null);

    document.getElementById('btnSteps').style.display = 'inline-block';
    document.getElementById('btnGraph').style.display = 'inline-block';
    document.getElementById('stepsBox').textContent = data.steps;
    document.getElementById('stepsCard').style.display = 'none';
    document.getElementById('graphCard').style.display = 'none';
}

function showResult(text, success) {
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    box.textContent = text;
    box.className = 'result-box ' + (success ? 'success' : 'error-box');
}

function toggleSteps() {
    const card = document.getElementById('stepsCard');
    const box = document.getElementById('stepsBox');
    if (card.style.display === 'none') {
        card.style.display = 'block';
        box.style.display = 'block';
    } else {
        card.style.display = 'none';
    }
}

function toggleGraph() {
    const card = document.getElementById('graphCard');
    const box = document.getElementById('graphBox');
    if (card.style.display === 'none') {
        card.style.display = 'block';
        box.style.display = 'block';
        drawGraph(lastData);
    } else {
        card.style.display = 'none';
    }
}

function clearAll() {
    document.getElementById('inputA').value = '';
    document.getElementById('inputB').value = '';
    document.getElementById('inputC').value = '';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('stepsCard').style.display = 'none';
    document.getElementById('graphCard').style.display = 'none';
    document.getElementById('btnSteps').style.display = 'none';
    document.getElementById('btnGraph').style.display = 'none';
    lastData = null;
}

function drawGraph(data) {
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const cx = W / 2;
    const cy = H / 2;
    const scale = 40;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // Сетка
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    for (let i = -10; i <= 10; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + i * scale, 0);
        ctx.lineTo(cx + i * scale, H);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, cy + i * scale);
        ctx.lineTo(W, cy + i * scale);
        ctx.stroke();
    }

    // Оси
    ctx.strokeStyle = '#718096';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();

    // Подписи осей
    ctx.fillStyle = '#718096';
    ctx.font = '13px Arial';
    ctx.fillText('x', W - 15, cy - 8);
    ctx.fillText('y', cx + 8, 15);

    // Числа на осях
    ctx.font = '10px Arial';
    ctx.fillStyle = '#a0aec0';
    for (let i = -8; i <= 8; i++) {
        if (i !== 0) {
            ctx.fillText(i, cx + i * scale - 5, cy + 15);
            ctx.fillText(-i, cx + 5, cy + i * scale + 4);
        }
    }

    // Парабола
    const a = data.a, b = data.b, c = data.c;
    ctx.strokeStyle = '#2c5282';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    let first = true;
    for (let px = 0; px <= W; px++) {
        const xv = (px - cx) / scale;
        const yv = a * xv * xv + b * xv + c;
        const py = cy - yv * scale;
        if (py >= -200 && py <= H + 200) {
            if (first) { ctx.moveTo(px, py); first = false; }
            else ctx.lineTo(px, py);
        } else { first = true; }
    }
    ctx.stroke();

    // Корни
    if (data.x1 !== null) {
        [data.x1, data.x2].forEach((x, i) => {
            const px = cx + x * scale;
            ctx.beginPath();
            ctx.arc(px, cy, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#e53e3e';
            ctx.fill();
            ctx.fillStyle = '#e53e3e';
            ctx.font = 'bold 11px Arial';
            ctx.fillText('x' + (i+1) + '=' + x.toFixed(2), px + 10, cy - 10);
        });
    }

    // Вершина
    const vx = -b / (2 * a);
    const vy = a * vx * vx + b * vx + c;
    const pvx = cx + vx * scale;
    const pvy = cy - vy * scale;
    ctx.beginPath();
    ctx.arc(pvx, pvy, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#276749';
    ctx.fill();
    ctx.fillStyle = '#276749';
    ctx.font = 'bold 11px Arial';
    ctx.fillText('(' + vx.toFixed(1) + ',' + vy.toFixed(1) + ')', pvx + 10, pvy - 10);
}
</script>

</body>
</html>
